<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 语音聊天</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --user: #2563eb;
    --user-fg: #ffffff;
    --bot: #f1f3f5;
    --bot-fg: #111;
    --muted: #6b7280;
    --thinking: #9ca3af;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0c10; --panel:#15171c; --user:#2563eb; --bot:#1f242b; --bot-fg:#e5e7eb; --muted:#9ca3af; --thinking:#6b7280; }
  }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background: var(--bg); }
  #app { max-width: 760px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; background: var(--panel); border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: var(--user); color: var(--user-fg); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bot); color: var(--bot-fg); border-bottom-left-radius: 4px; }
  .thinking { font-size: 12px; color: var(--thinking); margin-top: 4px; font-style: italic; white-space: pre-wrap; }
  .controls { display: flex; gap: 8px; align-items: center; padding-top: 10px; }
  #text { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; outline: none; background: var(--panel); color: inherit; }
  button { padding: 10px 14px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; }
  #send { background: var(--user); color: #fff; }
  #mic { background: #e5e7eb; min-width: 84px; }
  #mic.recording { background: var(--danger); color: #fff; }
  #mic:disabled, #send:disabled { opacity: .55; cursor: not-allowed; }
  .small { font-size: 12px; color: var(--muted); margin-left: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AI 语音聊天</h1>
    <span id="status">连接中…</span>
  </header>
  <div id="chat"></div>
  <div class="controls">
    <button id="mic" type="button">🎙 按下说话</button>
    <input id="text" type="text" placeholder="输入文字消息后回车发送" autocomplete="off">
    <button id="send" type="button">发送</button>
  </div>
  <div class="small">提示：再次点击🎙按钮停止录音并发送；AI 说话时点击🎙会立即打断。</div>
</div>
<script src="/static/app.js" type="module"></script>
</body>
</html>
